name: Attach specify-runtime binaries to release

on:
  release:
    types: [published]

env:
  PUBLIC_RELEASES_REPO: chenziyang110/spec-kit-plus-releases

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 1
          persist-credentials: false

      - name: Check whether runtime assets are missing or invalid
        id: assets
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          SOURCE_REVISION="$(git rev-parse HEAD)"
          python3 scripts/publish-runtime-release.py \
            --target-repo "${{ env.PUBLIC_RELEASES_REPO }}" \
            --tag "$RELEASE_TAG" \
            --source-revision "$SOURCE_REVISION" \
            --assets-dir tools/specify-runtime/bin \
            --token-env PUBLIC_RELEASES_TOKEN \
            --mode check \
            --github-output "$GITHUB_OUTPUT"
        env:
          PUBLIC_RELEASES_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}

      - uses: actions/setup-go@v7
        if: steps.assets.outputs.complete != 'true'
        with:
          go-version: '1.21'

      - name: Cross-compile specify-runtime
        if: steps.assets.outputs.complete != 'true'
        working-directory: tools/specify-runtime
        run: |
          mkdir -p bin
          VERSION="${{ github.event.release.tag_name }}"
          SOURCE_REVISION="$(git rev-parse HEAD)"
          IDENTITY_MARKER="specify-runtime.release.v1,version=${VERSION},revision=${SOURCE_REVISION},dirty=false"
          echo "Building specify-runtime ${VERSION}..."

          TARGETS="
          linux/amd64
          linux/arm64
          darwin/amd64
          darwin/arm64
          windows/amd64
          "

          for target in $TARGETS; do
            goos="${target%/*}"
            goarch="${target#*/}"
            ext=""
            if [ "$goos" = "windows" ]; then ext=".exe"; fi

            echo "  -> ${goos}/${goarch}"
            GOOS=${goos} GOARCH=${goarch} CGO_ENABLED=0 \
              go build -trimpath \
                -ldflags="-s -w -X main.version=${VERSION} -X github.com/chenziyang110/spec-kit-plus/tools/specify-runtime/internal/buildinfo.ReleaseIdentity=${IDENTITY_MARKER} -X github.com/chenziyang110/spec-kit-plus/tools/specify-runtime/internal/buildinfo.SourceRevision=${SOURCE_REVISION} -X github.com/chenziyang110/spec-kit-plus/tools/specify-runtime/internal/buildinfo.BuildDirty=false" \
                -o "bin/specify-runtime-${goos}-${goarch}${ext}" .
          done

          echo ""
          echo "=== Built binaries ==="
          ls -lh bin/
          VERSION="${{ github.event.release.tag_name }}"
          SOURCE_REVISION="$(git rev-parse HEAD)"
          chmod +x bin/specify-runtime-linux-amd64
          bin/specify-runtime-linux-amd64 --help | grep -q "cognition"
          bin/specify-runtime-linux-amd64 --help | grep -q "artifact"
          for asset in bin/specify-runtime-*; do
            grep -aF -- "$IDENTITY_MARKER" "$asset" >/dev/null
            grep -aF -- "specify-runtime.v1" "$asset" >/dev/null
          done
          version_json="$(bin/specify-runtime-linux-amd64 version --format json)"
          jq -e --arg version "$VERSION" --arg revision "$SOURCE_REVISION" \
            '.status == "ok" and .data.cli_version == $version and .data.protocol_version == "specify-runtime.v1" and .data.source_revision == $revision and .data.dirty == false' \
            <<<"$version_json" >/dev/null
          handshake_json="$(bin/specify-runtime-linux-amd64 api handshake --format json)"
          jq -e --arg version "$VERSION" --arg revision "$SOURCE_REVISION" \
            '.status == "ok" and .data.cli_version == $version and .data.source_revision == $revision and .data.dirty == false' \
            <<<"$handshake_json" >/dev/null
          grep -q '"api.ensure"' <<<"$handshake_json"
          grep -q '"api.pack"' <<<"$handshake_json"
          grep -q '"artifact.show-many"' <<<"$handshake_json"
          grep -q '"artifact.patch-batch"' <<<"$handshake_json"
          grep -q '"workflow.ensure"' <<<"$handshake_json"
          bin/specify-runtime-linux-amd64 artifact catalog --format json | grep -q '"quick-status"'
          bin/specify-runtime-linux-amd64 artifact catalog --format json | grep -q '"plan-contract"'
          workflow_help="$(bin/specify-runtime-linux-amd64 workflow --help 2>&1)"
          for command in show ensure enter next complete-stage transition reopen block reconcile-blocker resolve closeout; do
            grep -q "$command" <<<"$workflow_help"
          done
          bin/specify-runtime-linux-amd64 work --help 2>&1 | grep -q -- "unblock"
          bin/specify-runtime-linux-amd64 cognition scan-prepare --help 2>&1 | grep -q -- "-force"
          bin/specify-runtime-linux-amd64 cognition scan-prepare --help 2>&1 | grep -q -- "-safety-percent"
          scan_formats_help="$(bin/specify-runtime-linux-amd64 cognition scan-formats --help 2>&1 || true)"
          grep -q -- "-scan-set" <<<"$scan_formats_help"
          bin/specify-runtime-linux-amd64 cognition scan-policy-stage --help 2>&1 | grep -q -- "-proposal-json"
          bin/specify-runtime-linux-amd64 cognition scan-policy-confirm --help 2>&1 | grep -q -- "-proposal-digest"
          bin/specify-runtime-linux-amd64 cognition scan-lease --help 2>&1 | grep -q -- "-worker-capacity-tokens"
          bin/specify-runtime-linux-amd64 cognition scan-accept --help 2>&1 | grep -q -- "-packet-id"
          bin/specify-runtime-linux-amd64 design --help 2>&1 | grep -q -- "direction-confirm"
          bin/specify-runtime-linux-amd64 api show design.preview-lint --format json | grep -q -- "concept"

      - name: Publish public runtime release
        if: steps.assets.outputs.complete != 'true'
        run: |
          RELEASE_TAG="${{ github.event.release.tag_name }}"
          SOURCE_REVISION="$(git rev-parse HEAD)"
          python3 scripts/publish-runtime-release.py \
            --target-repo "${{ env.PUBLIC_RELEASES_REPO }}" \
            --tag "$RELEASE_TAG" \
            --source-revision "$SOURCE_REVISION" \
            --assets-dir tools/specify-runtime/bin \
            --token-env PUBLIC_RELEASES_TOKEN \
            --mode ensure-release
        env:
          PUBLIC_RELEASES_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
