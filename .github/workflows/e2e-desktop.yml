name: E2E desktop sample

permissions:
  contents: read

on:
  pull_request:
    paths:
      - 'tests/e2e_samples/**'
      - 'tests/test_e2e_desktop_sample.py'
      - 'tests/test_e2e_desktop_runner.py'
      - 'tests/test_e2e_desktop_scenarios.py'
      - 'tests/test_e2e_desktop_length_units.py'
      - 'scripts/shared/e2e_scenarios.py'
      - 'scripts/shared/e2e_coverage.py'
      - 'scripts/shared/e2e_runner.py'
      - 'scripts/shared/e2e_pytest_reporter.py'
      - 'tests/conftest.py'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/e2e-desktop.yml'
  workflow_dispatch:

concurrency:
  group: e2e-desktop-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/setup-go@v7
        with:
          go-version-file: tools/specify-runtime/go.mod
          cache-dependency-path: tools/specify-runtime/go.sum
      - name: Install display support
        run: sudo apt-get update && sudo apt-get install -y xvfb xauth python3-tk
      - name: Install repository test environment
        run: uv sync --extra test
      - name: Bind evidence to source
        run: git rev-parse HEAD > desktop-source.txt
      - name: Run real Tk event-loop and filesystem checks
        env:
          SPECIFY_E2E_REQUIRE_DESKTOP: '1'
          PYTEST_ADDOPTS: ''
          E2E_DESKTOP_TMP: ${{ runner.temp }}/e2e-desktop-${{ github.run_id }}-${{ github.run_attempt }}
        run: >-
          xvfb-run -a uv run pytest tests/test_e2e_desktop_sample.py
          tests/test_e2e_desktop_runner.py tests/test_e2e_desktop_scenarios.py
          tests/test_e2e_desktop_length_units.py --basetemp="$E2E_DESKTOP_TMP"
          --capture=sys --junitxml=desktop-results.xml
      - name: Reject empty or skipped sample execution
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          cases = list(ET.parse('desktop-results.xml').getroot().iter('testcase'))
          assert cases, 'No desktop cases were executed'
          for case in cases:
              assert not any(case.find(tag) is not None for tag in ('skipped', 'failure', 'error')), case.attrib
          print(f'{len(cases)} desktop/sample cases executed without failures or skips')
          PY
      - name: Preserve actual results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-desktop-${{ github.run_attempt }}
          path: |
            desktop-source.txt
            desktop-results.xml
            ${{ runner.temp }}/e2e-desktop-${{ github.run_id }}-${{ github.run_attempt }}/**/test-results/run/*.json
            ${{ runner.temp }}/e2e-desktop-${{ github.run_id }}-${{ github.run_attempt }}/**/test-results/run/runner.log
            ${{ runner.temp }}/e2e-desktop-${{ github.run_id }}-${{ github.run_attempt }}/**/desktop-v2*/full/*.json
            ${{ runner.temp }}/e2e-desktop-${{ github.run_id }}-${{ github.run_attempt }}/**/desktop-v2*/full/*-attempt-*/*.json
            ${{ runner.temp }}/e2e-desktop-${{ github.run_id }}-${{ github.run_attempt }}/**/book.json
            ${{ runner.temp }}/e2e-desktop-${{ github.run_id }}-${{ github.run_attempt }}/**/design.json
            ${{ runner.temp }}/e2e-desktop-${{ github.run_id }}-${{ github.run_attempt }}/**/trace.json
            ${{ runner.temp }}/e2e-desktop-${{ github.run_id }}-${{ github.run_attempt }}/**/audit.json
            ${{ runner.temp }}/e2e-desktop-${{ github.run_id }}-${{ github.run_attempt }}/**/inputs.json
            ${{ runner.temp }}/e2e-desktop-${{ github.run_id }}-${{ github.run_attempt }}/**/*-attempt-*/*.json
          retention-days: 14
          if-no-files-found: error
