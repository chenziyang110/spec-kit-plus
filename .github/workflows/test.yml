name: Test & Lint

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  assets:
    name: Document and asset policy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact source with comparison history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/specify-runtime/go.mod
          cache-dependency-path: tools/specify-runtime/go.sum
      - name: Build the shared policy runtime
        working-directory: tools/specify-runtime
        run: go build -o "$RUNNER_TEMP/specify-runtime" .
      - name: Check the exact changed snapshot
        shell: bash
        env:
          ASSET_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          ASSET_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [[ -z "$ASSET_BASE" || "$ASSET_BASE" =~ ^0+$ ]]; then
            ASSET_BASE=$(git rev-parse "$ASSET_HEAD^")
          fi
          "$RUNNER_TEMP/specify-runtime" assets check \
            --project-root "$GITHUB_WORKSPACE" \
            --from-ref "$ASSET_BASE" --to-ref "$ASSET_HEAD" --format json

  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Run ruff check
        run: uvx ruff check src/ --select E4,E7,E9,F

  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Set up Go for runtime integration tests
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/specify-runtime/go.mod
          cache-dependency-path: tools/specify-runtime/go.sum
      - name: Bind evidence to source
        run: git rev-parse HEAD > test-source.txt
      - name: Install dependencies
        run: uv sync --extra test
      - name: Run tests
        run: uv run pytest -n auto --junitxml=pytest-results.xml
      - name: Preserve test evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pytest-${{ matrix.python-version }}-${{ github.run_attempt }}
          path: |
            test-source.txt
            pytest-results.xml
          retention-days: 14
          if-no-files-found: error

  # Keep the original required-check name; native jobs are additive.
  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/specify-runtime
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python for evidence inspection
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/specify-runtime/go.mod
          cache-dependency-path: tools/specify-runtime/go.sum
      - name: Bind evidence to source
        run: git rev-parse HEAD > test-source.txt
      - name: Inventory runtime test packages
        run: go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./... > go-test-packages.txt
      - name: Run native runtime tests
        # Explicit bash retains pipefail; tee must never hide a failing test.
        run: go test -count=1 -json ./... | tee go-test-results.jsonl
      - name: Verify required runtime evidence
        if: ${{ !cancelled() }}
        run: >-
          python ../workflow-quality/verify_quick_rollout.py
          --inspect-go-log go-test-results.jsonl
          --go-packages go-test-packages.txt
          --module github.com/chenziyang110/spec-kit-plus/tools/specify-runtime
          > go-evidence-audit.json
      - name: Run Go static checks
        if: ${{ !cancelled() }}
        run: go vet ./...
      - name: Preserve runtime evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: go-linux-${{ github.run_attempt }}
          path: |
            tools/specify-runtime/test-source.txt
            tools/specify-runtime/go-test-results.jsonl
            tools/specify-runtime/go-test-packages.txt
            tools/specify-runtime/go-evidence-audit.json
          retention-days: 14
          if-no-files-found: error

  native:
    name: Native runtime and installer (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Set up native Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/specify-runtime/go.mod
          cache-dependency-path: tools/specify-runtime/go.sum
      - name: Bind evidence to source
        run: git rev-parse HEAD > test-source.txt
      - name: Install dependencies
        run: uv sync --extra test
      - name: Exercise real integration installer and repair
        run: >-
          uv run pytest
          tests/integrations/test_quick_optimization_installation.py
          tests/integrations/test_manifest_stat_observations.py
          tests/test_agent_context_managed_block.py
          tests/test_asset_guard_adapter.py
          tests/integrations/test_asset_guard_native_transport.py
          tests/integrations/test_asset_governance_installation.py
          tests/test_hook_asset_installation.py
          tests/integrations/test_integration_gemini.py
          --junitxml=native-installer-results.xml
      - name: Inventory runtime test packages
        if: ${{ !cancelled() }}
        working-directory: tools/specify-runtime
        run: go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}}{{end}}' ./... > go-test-packages.txt
      - name: Run native runtime tests
        if: ${{ !cancelled() }}
        working-directory: tools/specify-runtime
        run: go test -count=1 -json ./... | tee go-test-results.jsonl
      - name: Verify required runtime evidence
        if: ${{ !cancelled() }}
        working-directory: tools/specify-runtime
        run: >-
          python ../workflow-quality/verify_quick_rollout.py
          --inspect-go-log go-test-results.jsonl
          --go-packages go-test-packages.txt
          --module github.com/chenziyang110/spec-kit-plus/tools/specify-runtime
          > go-evidence-audit.json
      - name: Run native Go static checks
        if: ${{ !cancelled() }}
        working-directory: tools/specify-runtime
        run: go vet ./...
      - name: Preserve native evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: native-${{ matrix.os }}-${{ github.run_attempt }}
          path: |
            test-source.txt
            native-installer-results.xml
            tools/specify-runtime/go-test-results.jsonl
            tools/specify-runtime/go-test-packages.txt
            tools/specify-runtime/go-evidence-audit.json
          retention-days: 14
          if-no-files-found: error
