name: Test & Lint

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Run ruff check
        run: uvx ruff check src/ --select E4,E7,E9,F

  pytest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Go for runtime integration tests
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/specify-runtime/go.mod
          cache-dependency-path: tools/specify-runtime/go.sum

      - name: Install dependencies
        run: uv sync --extra test

      - name: Run tests
        run: uv run pytest -n auto

  go:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/specify-runtime
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: tools/specify-runtime/go.mod
          cache-dependency-path: tools/specify-runtime/go.sum

      - name: Run native runtime tests
        # Tests create many temporary project paths. Disable result caching to
        # execute every run and avoid expensive cached-input checks.
        run: go test -count=1 ./...

      - name: Run Go static checks
        run: go vet ./...
