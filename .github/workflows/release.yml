name: Create Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to release, for example v0.5.1'
        required: true
        type: string

# Public releases contain only the five prebuilt specify-runtime binaries and
# SHA256SUMS; source code and Git history remain in the private repository.
# Human `specify init`/upgrade verifies the binary and pins the relative
# project-local `.specify/bin/specify-runtime` entrypoint (`.exe` on Windows).
# SPECIFY_RUNTIME_BIN, PATH, and user-scoped cache paths are bootstrap/repair
# sources only; they are never rendered into agent commands. Generated commands
# invoke only the pinned project-local entrypoint.
# See docs/runtime-release-distribution.md for the public release checklist.
env:
  PUBLIC_RELEASES_REPO: chenziyang110/spec-kit-plus-releases

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: false
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Extract version from tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.tag }}"
          else
            VERSION=${GITHUB_REF#refs/tags/}
          fi
          if [[ ! "$VERSION" =~ ^v[0-9]+(\.[0-9]+){2}([-.][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $VERSION"
            exit 1
          fi
          echo "tag=$VERSION" >> $GITHUB_OUTPUT
          echo "Building release for $VERSION"

      - name: Check if release already exists
        id: check_release
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          SOURCE_REVISION="$(git rev-parse HEAD)"
          python3 scripts/publish-runtime-release.py \
            --target-repo "${{ env.PUBLIC_RELEASES_REPO }}" \
            --tag "$VERSION" \
            --source-revision "$SOURCE_REVISION" \
            --assets-dir dist/release-tools \
            --token-env PUBLIC_RELEASES_TOKEN \
            --mode check \
            --github-output "$GITHUB_OUTPUT"
        env:
          PUBLIC_RELEASES_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}

      - uses: actions/setup-go@v7
        if: steps.check_release.outputs.complete != 'true'
        with:
          go-version: '1.21'

      - name: Cross-compile release tool binaries
        if: steps.check_release.outputs.complete != 'true'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          SOURCE_REVISION="$(git rev-parse HEAD)"
          mkdir -p dist/release-tools

          TARGETS="
          linux/amd64
          linux/arm64
          darwin/amd64
          darwin/arm64
          windows/amd64
          "

          build_tool() {
            local tool="$1"
            local dir="$2"
            local ldflags="-s -w -X main.version=${VERSION}"
            if [ "$tool" = "specify-runtime" ]; then
              local identity_marker="specify-runtime.release.v1,version=${VERSION},revision=${SOURCE_REVISION},dirty=false"
              ldflags="${ldflags} -X github.com/chenziyang110/spec-kit-plus/tools/specify-runtime/internal/buildinfo.ReleaseIdentity=${identity_marker} -X github.com/chenziyang110/spec-kit-plus/tools/specify-runtime/internal/buildinfo.SourceRevision=${SOURCE_REVISION} -X github.com/chenziyang110/spec-kit-plus/tools/specify-runtime/internal/buildinfo.BuildDirty=false"
            fi
            echo "Building ${tool} ${VERSION}..."
            for target in $TARGETS; do
              goos="${target%/*}"
              goarch="${target#*/}"
              ext=""
              if [ "$goos" = "windows" ]; then ext=".exe"; fi

              echo "  -> ${tool} ${goos}/${goarch}"
              (
                cd "$dir"
                GOOS=${goos} GOARCH=${goarch} CGO_ENABLED=0 \
                  go build -trimpath \
                    -ldflags="${ldflags}" \
                    -o "../../dist/release-tools/${tool}-${goos}-${goarch}${ext}" .
              )
            done
          }

          build_tool "specify-runtime" "tools/specify-runtime"

          echo ""
          echo "=== Built release tool binaries ==="
          ls -lh dist/release-tools/

      - name: Smoke-test specify-runtime release binary
        if: steps.check_release.outputs.complete != 'true'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          SOURCE_REVISION="$(git rev-parse HEAD)"
          IDENTITY_MARKER="specify-runtime.release.v1,version=${VERSION},revision=${SOURCE_REVISION},dirty=false"
          chmod +x ./dist/release-tools/specify-runtime-linux-amd64
          ./dist/release-tools/specify-runtime-linux-amd64 --help | grep -q "cognition"
          ./dist/release-tools/specify-runtime-linux-amd64 --help | grep -q "artifact"
          ./dist/release-tools/specify-runtime-linux-amd64 --help | grep -q "workflow"
          ./dist/release-tools/specify-runtime-linux-amd64 --help | grep -q "validate"
          ./dist/release-tools/specify-runtime-linux-amd64 --help | grep -q "discussion"
          ./dist/release-tools/specify-runtime-linux-amd64 --help | grep -q "learning"
          ./dist/release-tools/specify-runtime-linux-amd64 --help | grep -q "design"
          ./dist/release-tools/specify-runtime-linux-amd64 --help | grep -q "implement"
          ./dist/release-tools/specify-runtime-linux-amd64 --help | grep -q "review"
          ./dist/release-tools/specify-runtime-linux-amd64 --help | grep -q "accept"
          ./dist/release-tools/specify-runtime-linux-amd64 --help | grep -q "sp-teams"
          for asset in ./dist/release-tools/specify-runtime-*; do
            grep -aF -- "$IDENTITY_MARKER" "$asset" >/dev/null
            grep -aF -- "specify-runtime.v1" "$asset" >/dev/null
          done
          version_json="$(./dist/release-tools/specify-runtime-linux-amd64 version --format json)"
          jq -e --arg version "$VERSION" --arg revision "$SOURCE_REVISION" \
            '.status == "ok" and .data.cli_version == $version and .data.protocol_version == "specify-runtime.v1" and .data.source_revision == $revision and .data.dirty == false' \
            <<<"$version_json" >/dev/null
          handshake_json="$(./dist/release-tools/specify-runtime-linux-amd64 api handshake --format json)"
          jq -e --arg version "$VERSION" --arg revision "$SOURCE_REVISION" \
            '.status == "ok" and .data.cli_version == $version and .data.source_revision == $revision and .data.dirty == false' \
            <<<"$handshake_json" >/dev/null
          grep -q '"discussion.init"' <<<"$handshake_json"
          grep -q '"learning.start"' <<<"$handshake_json"
          grep -q '"sp-teams.submit-result"' <<<"$handshake_json"
          grep -q '"api.ensure"' <<<"$handshake_json"
          grep -q '"api.pack"' <<<"$handshake_json"
          grep -q '"artifact.show-many"' <<<"$handshake_json"
          grep -q '"artifact.patch-batch"' <<<"$handshake_json"
          grep -q '"workflow.ensure"' <<<"$handshake_json"
          ./dist/release-tools/specify-runtime-linux-amd64 artifact catalog --format json | grep -q '"quick-status"'
          ./dist/release-tools/specify-runtime-linux-amd64 artifact catalog --format json | grep -q '"plan-contract"'
          workflow_help="$(./dist/release-tools/specify-runtime-linux-amd64 workflow --help 2>&1)"
          for command in show ensure enter next complete-stage transition reopen block resolve closeout; do
            grep -q "$command" <<<"$workflow_help"
          done
          ./dist/release-tools/specify-runtime-linux-amd64 cognition scan-prepare --help 2>&1 | grep -q -- "-force"
          ./dist/release-tools/specify-runtime-linux-amd64 cognition scan-prepare --help 2>&1 | grep -q -- "-safety-percent"
          scan_formats_help="$(./dist/release-tools/specify-runtime-linux-amd64 cognition scan-formats --help 2>&1 || true)"
          grep -q -- "-scan-set" <<<"$scan_formats_help"
          ./dist/release-tools/specify-runtime-linux-amd64 cognition scan-policy-stage --help 2>&1 | grep -q -- "-proposal-json"
          ./dist/release-tools/specify-runtime-linux-amd64 cognition scan-policy-confirm --help 2>&1 | grep -q -- "-proposal-digest"
          ./dist/release-tools/specify-runtime-linux-amd64 cognition scan-lease --help 2>&1 | grep -q -- "-worker-capacity-tokens"
          ./dist/release-tools/specify-runtime-linux-amd64 cognition scan-accept --help 2>&1 | grep -q -- "-packet-id"
          ./dist/release-tools/specify-runtime-linux-amd64 cognition --help | grep -q "semantic-intake"
          ./dist/release-tools/specify-runtime-linux-amd64 cognition semantic-intake --help 2>&1 | grep -q -- "-input-json"
          ./dist/release-tools/specify-runtime-linux-amd64 cognition semantic-audit-resume --help 2>&1 | grep -q -- "-input-json"
          ./dist/release-tools/specify-runtime-linux-amd64 cognition compass --help 2>&1 | grep -q -- "-semantic-intake-json"
          ./dist/release-tools/specify-runtime-linux-amd64 cognition compass --help 2>&1 | grep -q -- "-query-plan"
          ./dist/release-tools/specify-runtime-linux-amd64 cognition expand --help 2>&1 | grep -q -- "-section"
          ./dist/release-tools/specify-runtime-linux-amd64 cognition delta append --help 2>&1 | grep -q -- "-verification"
          ./dist/release-tools/specify-runtime-linux-amd64 cognition delta append --help 2>&1 | grep -q -- "-generated-surface"
          ./dist/release-tools/specify-runtime-linux-amd64 cognition closeout-plan --help 2>&1 | grep -q -- "-workflow"
          ./dist/release-tools/specify-runtime-linux-amd64 cognition closeout-plan --help 2>&1 | grep -q -- "-delta-session"
          tmpdir="$(mktemp -d)"
          cp templates/examples/semantic-audit-resume/semantic-audit-input.json "$tmpdir/"
          cp templates/examples/semantic-audit-resume/semantic-audit-output.json "$tmpdir/"
          cp templates/examples/semantic-audit-resume/resume-validation.json "$tmpdir/"
          cp templates/examples/semantic-audit-resume/resume-validation-route-changed.json "$tmpdir/"
          runtime_bin="$PWD/dist/release-tools/specify-runtime-linux-amd64"
          (cd "$tmpdir" && "$runtime_bin" cognition semantic-audit-resume --format json < resume-validation.json) | grep -q '"semantic_audit_resume_status":"fresh"'
          (cd "$tmpdir" && "$runtime_bin" cognition semantic-audit-resume --format json < resume-validation-route-changed.json) | grep -q '"semantic_audit_resume_status":"needs-rerun"'

      - name: Publish public runtime release
        if: steps.check_release.outputs.complete != 'true'
        run: |
          VERSION="${{ steps.version.outputs.tag }}"
          SOURCE_REVISION="$(git rev-parse HEAD)"
          python3 scripts/publish-runtime-release.py \
            --target-repo "${{ env.PUBLIC_RELEASES_REPO }}" \
            --tag "$VERSION" \
            --source-revision "$SOURCE_REVISION" \
            --assets-dir dist/release-tools \
            --token-env PUBLIC_RELEASES_TOKEN \
            --mode ensure-release
        env:
          PUBLIC_RELEASES_TOKEN: ${{ secrets.PUBLIC_RELEASES_TOKEN }}
