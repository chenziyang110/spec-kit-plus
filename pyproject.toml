[project]
name = "specify-cli"
version = "0.8.5"
description = "Specify CLI for Spec Kit Plus. A tool to bootstrap projects for Spec-Driven Development (SDD)."
requires-python = ">=3.11"
dependencies = [
    "anyio>=4.14.2",
    "typer",
    "click>=8.5.0",
    "rich",
    "platformdirs",
    "readchar>=4.2.2",
    "pyyaml>=6.0.3",
    "packaging>=26.3",
    "pathspec>=1.1.1",
    "json5>=0.15.0",
    "jsonschema>=4.26.0",
    "Jinja2>=3.1.6,<4",
    "pydantic-graph<2",
]

[project.scripts]
specify = "specify_cli:main"
specify-teams-mcp = "specify_cli.mcp.teams_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/specify_cli"]
# Force-inclusion bypasses exclusions. Select the native module normally so
# its known local build/test roots can be omitted without listing every source.
only-include = ["src/specify_cli", "tools/specify-runtime"]
sources = {"src" = "", "tools/specify-runtime" = "specify_cli/core_pack/tools/specify-runtime"}
# The declared source boundary must not depend on local/global Git ignore rules
# (which can match legitimate hidden testdata). Keep explicit exclusions below
# in sync with verify_e2e_wheel.py and its real-Hatch probe.
ignore-vcs = true
exclude = [
    "/tools/specify-runtime/.tmp/**",
    "/tools/specify-runtime/.tmp-*/**",
    "/tools/specify-runtime/.gocache/**",
    "/tools/specify-runtime/bin/**",
    "/tools/specify-runtime/*-cover.out",
    "**/.git", "**/.git/**",
    "**/.hg", "**/.hg/**",
    "**/.svn", "**/.svn/**",
    "**/.bzr", "**/.bzr/**",
]

[tool.hatch.build.targets.wheel.force-include]
# Bundle core assets so `specify init` works without network access (air-gapped / enterprise)
